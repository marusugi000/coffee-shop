<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ページが見つかりません | SGMT LOCAL ROASTERY</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --brown:      #3e2a1e;
      --brown-mid:  #5a3e2b;
      --cream:      #fdf6ec;
      --cream-dark: #f5e9d8;
      --border:     #e8d5bc;
      --text-muted: #7a5c3e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Serif JP', Georgia, serif;
      background: var(--cream);
      color: var(--brown);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── ナビゲーション ── */
    nav {
      background: var(--brown);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      height: 56px;
      flex-shrink: 0;
    }
    .nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1em;
      color: var(--cream);
      letter-spacing: 0.15em;
      text-decoration: none;
    }
    .nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
    .nav-links a {
      color: #d4b896;
      text-decoration: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 0.78em;
      font-family: sans-serif;
      transition: background 0.2s;
    }
    .nav-links a:hover { background: var(--brown-mid); color: white; }

    /* ── メインエリア（画面中央に配置）── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .error-box {
      text-align: center;
      max-width: 480px;
    }

    /* コーヒーカップのアニメーション */
    .coffee-icon {
      font-size: 5em;
      display: block;
      margin-bottom: 24px;
      animation: steam 2s ease-in-out infinite;
    }
    @keyframes steam {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    /* 404の大きな数字 */
    .error-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5em, 20vw, 9em);
      color: var(--border);
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }

    .error-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.3em, 4vw, 1.8em);
      font-weight: 400;
      color: var(--brown);
      margin-bottom: 16px;
      letter-spacing: 0.04em;
    }
    .error-desc {
      font-size: 0.88em;
      color: var(--text-muted);
      font-family: sans-serif;
      line-height: 1.8;
      margin-bottom: 36px;
    }

    /* ボタングループ */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn-primary {
      background: var(--brown);
      color: white;
      padding: 13px 32px;
      border-radius: 2px;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 0.85em;
      letter-spacing: 0.1em;
      transition: background 0.2s;
      min-height: 48px;
      display: flex;
      align-items: center;
    }
    .btn-primary:hover { background: var(--brown-mid); }
    .btn-outline {
      border: 1px solid var(--border);
      color: var(--brown);
      padding: 13px 32px;
      border-radius: 2px;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 0.85em;
      letter-spacing: 0.1em;
      transition: background 0.2s;
      min-height: 48px;
      display: flex;
      align-items: center;
    }
    .btn-outline:hover { background: var(--cream-dark); }

    /* ページリンク */
    .page-links {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }
    .page-links p {
      font-size: 0.8em;
      color: var(--text-muted);
      font-family: sans-serif;
      margin-bottom: 14px;
    }
    .page-links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .page-link {
      background: white;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 16px;
      text-decoration: none;
      font-family: sans-serif;
      font-size: 0.82em;
      color: var(--brown);
      transition: background 0.2s, border-color 0.2s;
    }
    .page-link:hover { background: var(--cream-dark); border-color: var(--brown); }

    /* フッター */
    footer {
      background: var(--brown);
      color: rgba(253,246,236,0.5);
      text-align: center;
      padding: 20px 24px;
      font-family: sans-serif;
      font-size: 0.78em;
      letter-spacing: 0.1em;
      flex-shrink: 0;
    }

    /* スマホ対応 */
    @media (max-width: 480px) {
      nav { flex-direction: column; height: auto; padding: 10px 16px; gap: 6px; }
      .nav-logo { font-size: 0.82em; }
      .nav-links a { font-size: 0.72em; padding: 4px 8px; }
      .btn-group { flex-direction: column; align-items: center; }
      .btn-primary, .btn-outline { width: 100%; max-width: 280px; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- ナビゲーション -->
  <nav>
    <a href="/" class="nav-logo">SGMT LOCAL ROASTERY</a>
    <div class="nav-links">
      <a href="/">トップ</a>
      <a href="/about/">お店について</a>
      <a href="/brew/">コーヒーの淹れ方</a>
      <a href="/leather/">革細工について</a>
    </div>
  </nav>

  <!-- エラーコンテンツ -->
  <main>
    <div class="error-box">

      <span class="coffee-icon">☕</span>

      <div class="error-num">404</div>

      <h1 class="error-title">ページが見つかりません</h1>

      <p class="error-desc">
        お探しのページは移動・削除されたか、<br>
        URLが間違っている可能性があります。<br>
        一杯コーヒーを飲みながら、もう一度お探しください。
      </p>

      <div class="btn-group">
        <a href="/" class="btn-primary">トップページへ戻る</a>
        <a href="mailto:marusugi000ddd@gmail.com" class="btn-outline">お問い合わせ</a>
        <!-- ↑ メールアドレスを自分のものに変えてください -->
      </div>

      <!-- よく見られるページへのリンク -->
      <div class="page-links">
        <p>よく見られているページ</p>
        <div class="page-links-grid">
          <a href="/" class="page-link">🛒 商品一覧</a>
          <a href="/about/" class="page-link">🏠 お店について</a>
          <a href="/brew/" class="page-link">☕ コーヒーの淹れ方</a>
          <a href="/leather/" class="page-link">✋ 革細工について</a>
          <a href="/faq/" class="page-link">❓ よくある質問</a>
        </div>
      </div>

    </div>
  </main>

  <!-- フッター -->
  <footer>
    <p>© 2026 SGMT LOCAL ROASTERY</p>
  </footer>

</body>
</html>
